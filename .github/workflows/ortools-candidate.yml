name: OR-Tools Candidate Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ortools-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  source-build-probe:
    name: ${{ matrix.name }} / candidate source build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-24.04
            target: linux-x86_64
            generator: Unix Makefiles
            generator-platform: ""
          - name: Windows x86_64
            os: windows-2025
            target: windows-x86_64
            generator: Visual Studio 17 2022
            generator-platform: x64
          - name: macOS arm64
            os: macos-15
            target: macos-arm64
            generator: Unix Makefiles
            generator-platform: ""
          - name: macOS x86_64
            os: macos-15-intel
            target: macos-x86_64
            generator: Unix Makefiles
            generator-platform: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test non-distributable candidate
        run: >-
          cmake
          "-DREPOSITORY_ROOT=${{ github.workspace }}"
          "-DPROBE_ROOT=${{ runner.temp }}/eutheto-ortools-candidate"
          "-DPROBE_TARGET=${{ matrix.target }}"
          "-DPROBE_RUNNER_OS=${{ runner.os }}"
          "-DPROBE_RUNNER_ARCH=${{ runner.arch }}"
          "-DPROBE_GENERATOR=${{ matrix.generator }}"
          "-DPROBE_GENERATOR_PLATFORM=${{ matrix.generator-platform }}"
          -P "${{ github.workspace }}/workers/ortools/cmake/candidate_probe.cmake"

      - name: Upload candidate non-distributable text evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-non-distributable-evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eutheto-ortools-candidate/evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
          include-hidden-files: false
