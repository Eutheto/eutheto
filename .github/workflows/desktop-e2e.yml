name: Desktop E2E

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-e2e.yml"
      - ".cargo/**"
      - "apps/desktop/**"
      - "crates/eutheto-core/**"
      - "crates/eutheto-types/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-e2e.yml"
      - ".cargo/**"
      - "apps/desktop/**"
      - "crates/eutheto-core/**"
      - "crates/eutheto-types/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: UTC
  LANG: C
  LC_ALL: C
  CARGO_TERM_COLOR: never

jobs:
  phase-00-shell-launch:
    name: ${{ matrix.name }} / Phase-00 shell launch (not packaged E2E)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-24.04
          - name: Ubuntu arm64
            os: ubuntu-24.04-arm
          - name: macOS x86_64
            os: macos-15-intel
          - name: macOS arm64
            os: macos-15
          - name: Windows x86_64
            os: windows-2025
          - name: Windows arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          check-latest: false

      - name: Install Linux launch prerequisites and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            xvfb

      - name: Activate repository toolchain pins
        shell: bash
        run: |
          rustup show active-toolchain
          test "$(rustc --version | cut -d ' ' -f 2)" = "1.97.1"
          corepack enable
          corepack install
          test "$(node --version)" = "v24.20.0"
          test "$(pnpm --version)" = "11.24.0"

      - name: Install locked dependencies and build the unbundled shell
        shell: bash
        run: |
          cargo fetch --locked
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @eutheto/desktop run tauri build --no-bundle

      - name: Launch the shell under a Linux virtual display
        if: runner.os == 'Linux'
        env:
          NO_AT_BRIDGE: "1"
        run: |
          set +e
          timeout --signal=TERM 10s xvfb-run -a \
            --server-args="-screen 0 1280x720x24" \
            target/release/eutheto-desktop \
            > "$RUNNER_TEMP/eutheto-desktop.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$RUNNER_TEMP/eutheto-desktop.log"
            echo "The desktop shell exited before the launch-smoke interval (status $status)." >&2
            exit 1
          fi

      - name: Launch the shell on macOS
        if: runner.os == 'macOS'
        run: |
          target/release/eutheto-desktop \
            > "$RUNNER_TEMP/eutheto-desktop.log" 2>&1 &
          desktop_pid=$!
          sleep 10
          if ! kill -0 "$desktop_pid" 2>/dev/null; then
            wait "$desktop_pid" || status=$?
            cat "$RUNNER_TEMP/eutheto-desktop.log"
            echo "The desktop shell exited before the launch-smoke interval (status ${status:-0})." >&2
            exit 1
          fi
          kill "$desktop_pid"
          wait "$desktop_pid" || true

      - name: Launch the shell on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "eutheto-desktop.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "eutheto-desktop.stderr.log"
          $binary = Resolve-Path "target/release/eutheto-desktop.exe"
          $process = Start-Process -FilePath $binary -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "The desktop shell exited before the launch-smoke interval with status $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()

      - name: Record the smoke-test boundary
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo "The actual unbundled Phase-00 Tauri shell built and remained running for the launch-smoke interval."
            echo "This is not packaged product E2E and does not prove installers, WebView2 deployment/support, signing, notarization, updater behavior, or production identifiers."
          } >> "$GITHUB_STEP_SUMMARY"
