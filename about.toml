# SPDX-License-Identifier: Apache-2.0

# This list records licenses accepted for dependency-notice generation. It does
# not conclude that a package is correctly licensed. Unlisted, ambiguous, or
# custom terms must fail generation and receive package-scoped legal review.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
]
ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false

# cargo-about keys overrides by crate name, while deny.toml pins the exact
# reviewed versions. These MPL-2.0 crates are transitive Tauri implementation
# or platform helpers; artifact obligations remain a release review gate.
[cssparser]
accepted = ["MPL-2.0"]

[cssparser-macros]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]

[option-ext]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]
