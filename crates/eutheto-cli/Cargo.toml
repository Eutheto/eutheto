[package]
name = "eutheto-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "optimizer"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
dirs = "=6.0.0"
eutheto-core = { path = "../eutheto-core" }
eutheto-domain-ir = { path = "../eutheto-domain-ir" }
eutheto-export = { path = "../eutheto-export" }
eutheto-import = { path = "../eutheto-import" }
eutheto-types = { path = "../eutheto-types" }
serde = "=1.0.229"
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "rt-multi-thread", "signal"] }

[dev-dependencies]
eutheto-command = { path = "../eutheto-command" }
eutheto-store = { path = "../eutheto-store" }
tempfile = "=3.27.0"
